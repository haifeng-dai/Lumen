[package]
name = "lumen"
version = "0.2.0"
edition = "2024"
description = "A modern literature manager built with GPUI"
repository = "https://github.com/LumenLib/Lumen"
license = "MIT"

[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.dependencies]
models = { path = "crates/models" }
database = { path = "crates/database" }
services = { path = "crates/services" }
parser = { path = "crates/parser" }
i18n = { path = "crates/i18n" }
translate = { path = "crates/translate" }
ai = { path = "crates/ai" }
file = { path = "crates/file" }
components = { path = "crates/components" }
anyhow = "1.0.100"
chrono = "0.4"
futures-util = "0.3"
gpui = { git = "https://github.com/zed-industries/zed" }
gpui-component = { git = "https://github.com/longbridge/gpui-component" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit", "wayland", "x11"] }
log = "0.4.29"
quick-xml = "0.39.4"
reqwest = { version = "0.13.1", default-features = false }
rusqlite = { version = "0.40", features = ["bundled", "backup"] }
serde = "1.0"
serde_json = "1.0"
sha2 = "0.10"
tokio = "1.49.0"
unicode-normalization = "0.1.25"
urlencoding = "2.1.3"
uuid = "1.0"

[dependencies]
models = { workspace = true }
database = { workspace = true }
services = { workspace = true }
parser = { workspace = true }
i18n = { workspace = true, features = ["gpui"] }
translate = { workspace = true }
ai = { workspace = true }
file = { workspace = true }
components = { workspace = true }
anyhow = { workspace = true }
arboard = "3"
image = "0.25"
smallvec = "1.13"
chrono = { workspace = true, features = ["serde"] }
env_logger = "0.11.8"
futures-util = { workspace = true }
gpui = { workspace = true }
gpui-component = { workspace = true }
gpui-component-assets = { workspace = true }
gpui_platform = { workspace = true }
libc = "0.2"
log = { workspace = true }
notify = "8.2.0"
reqwest = { workspace = true, features = ["json", "stream", "default-tls"] }
rust-embed = "8.9.0"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["full"] }
unicode-normalization = { workspace = true }
uuid = { workspace = true, features = ["serde", "v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"

[profile.release]
opt-level = 3
strip = true

[build-dependencies]
winresource = "0.1"

# objc 0.2 的 msg_send! 宏会展开出 #[cfg(feature = "cargo-clippy")]，Rust 1.80+ 对未声明 cfg 值报警告。
# 声明该 feature 值为预期以消除误报（仅抑制 cargo-clippy，其它未知 cfg 仍正常告警）。
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }
